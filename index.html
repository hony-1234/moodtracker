<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>心情加油站 | 學生情緒健康與輔導管理系統</title>
    
    <!-- Premium Emoji Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>">
    
    <!-- Meta SEO Tags -->
    <meta name="description" content="心情加油站是一個專為學校設計的學生情緒健康管理系統。透過實時情緒指數統計、歷史趨勢圖表與 AI 關鍵字敏感度篩選（心聲箱），協助輔導教師與班主任掌握孩子的心靈狀態，守護學生安全。" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <!-- Preload Critical Scene Assets (High Priority WebP & BGM) for Instant Smooth Transitions -->
    <link rel="preload" as="image" href="./學校圖檔/school_cartoon_backdrop.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="./學校圖檔/school_main_gate.webp" type="image/webp" />
    <link rel="preload" as="image" href="./學校圖檔/school_cartoon_map.webp" type="image/webp" />
    <link rel="preload" as="image" href="./學校圖檔/教室/classroom_cartoon_backdrop.webp" type="image/webp" />
    <link rel="preload" as="image" href="./學校圖檔/學生/cartoon_journal_cover.webp" type="image/webp" />
    <link rel="preload" as="audio" href="./audio/bgm.mp3" type="audio/mpeg" />
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
